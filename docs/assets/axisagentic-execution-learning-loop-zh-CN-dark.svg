<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">AxisAgentic 从执行到学习的数据闭环</title>
  <desc id="desc">模型和工具由 Agent Runtime 驱动并写入只追加轨迹。轨迹同时支持回放与评估，以及面向状态忠实 SFT 的轨迹采集。外部训练产生的新模型再回到 Runtime。</desc>
  <defs>
    <linearGradient id="runtime" x1="390" y1="75" x2="690" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6079ed"/>
      <stop offset="1" stop-color="#855fe0"/>
    </linearGradient>
    <linearGradient id="trace" x1="760" y1="75" x2="1090" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#179f99"/>
      <stop offset="1" stop-color="#466fda"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8492b5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g fill="none" stroke="#8492b5" stroke-width="4" marker-end="url(#arrow)">
    <path d="M320 135H390"/>
    <path d="M690 135H760"/>
    <path d="M1090 112C1135 112 1138 90 1190 90"/>
    <path d="M1090 158C1135 160 1145 255 1176.45 283.15" marker-end="none"/>
    <path d="M1190 295L1170.52 289.92L1182.38 276.38Z" fill="#8492b5" stroke="none" marker-end="none"/>
    <path d="M1365 150V220" stroke-dasharray="8 8"/>
    <path d="M1190 330C1145 335 1135 445 1103.55 473.15" marker-end="none"/>
    <path d="M1090 485L1097.62 466.38L1109.48 479.92Z" fill="#8492b5" stroke="none" marker-end="none"/>
    <path d="M760 485H540C515 485 500 470 500 445V205"/>
  </g>

  <g font-family="Avenir, 'Avenir Next', Inter, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="60" y="75" width="260" height="120" rx="22" fill="#171d2c" stroke="#657294" stroke-width="2"/>
      <rect x="390" y="75" width="300" height="120" rx="22" fill="url(#runtime)"/>
      <rect x="760" y="75" width="330" height="120" rx="22" fill="url(#trace)"/>
      <rect x="1190" y="30" width="350" height="120" rx="22" fill="#171d2c" stroke="#6879aa" stroke-width="2"/>
      <rect x="1190" y="220" width="350" height="150" rx="22" fill="#132624" stroke="#3b9994" stroke-width="2"/>
      <rect x="760" y="430" width="330" height="110" rx="22" fill="#211a2e" stroke="#8869b7" stroke-width="2"/>
    </g>

    <g fill="#eef1ff">
      <text x="190" y="124" font-size="28" font-weight="600">模型 + 工具</text>
      <text x="190" y="158" font-size="19" fill="#aab3ca">可插拔客户端 • 工具 API</text>

      <text x="1365" y="78" font-size="27" font-weight="600">回放与评估</text>
      <text x="1365" y="112" font-size="19" fill="#aab3ca">检查 • 指标 • 仪表盘</text>

      <text x="1365" y="278" font-size="27" font-weight="600">轨迹采集</text>
      <text x="1365" y="313" font-size="19" fill="#9bc8c4">质量筛选</text>
      <text x="1365" y="342" font-size="19" fill="#9bc8c4">状态忠实 SFT 导出</text>

      <text x="925" y="476" font-size="27" font-weight="600">新模型</text>
      <text x="925" y="510" font-size="19" fill="#beaada">外部训练</text>
    </g>

    <g fill="#ffffff">
      <text x="540" y="124" font-size="28" font-weight="600">Agent Runtime</text>
      <text x="540" y="158" font-size="19" fill="#eef0ff">上下文 • 恢复 • 编排</text>

      <text x="925" y="124" font-size="28" font-weight="600">只追加轨迹</text>
      <text x="925" y="158" font-size="19" fill="#e8ffff">运行时可见状态</text>
    </g>

    <g font-size="17" font-weight="600" fill="#9ca8c5">
      <text x="1142" y="192">轨迹事件</text>
      <text x="1439" y="192">质量信号</text>
      <text x="620" y="470">反馈</text>
    </g>
  </g>
</svg>
