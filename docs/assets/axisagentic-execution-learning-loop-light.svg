<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">AxisAgentic execution-to-learning loop</title>
  <desc id="desc">Models and tools run through the agent runtime into an append-only trace. The trace supports replay and evaluation as well as trajectory collection for state-faithful SFT. External training produces a new model that returns to the runtime.</desc>
  <defs>
    <linearGradient id="runtime" x1="390" y1="75" x2="690" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#566fe8"/>
      <stop offset="1" stop-color="#7c56d9"/>
    </linearGradient>
    <linearGradient id="trace" x1="760" y1="75" x2="1090" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1aaca5"/>
      <stop offset="1" stop-color="#4077df"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607094"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#26365f" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g fill="none" stroke="#607094" stroke-width="4" marker-end="url(#arrow)">
    <path d="M320 135H390"/>
    <path d="M690 135H760"/>
    <path d="M1090 112C1135 112 1138 90 1190 90"/>
    <path d="M1090 158C1135 160 1145 255 1176.45 283.15" marker-end="none"/>
    <path d="M1190 295L1170.52 289.92L1182.38 276.38Z" fill="#607094" stroke="none" marker-end="none"/>
    <path d="M1365 150V220" stroke-dasharray="8 8"/>
    <path d="M1190 330C1145 335 1135 445 1103.55 473.15" marker-end="none"/>
    <path d="M1090 485L1097.62 466.38L1109.48 479.92Z" fill="#607094" stroke="none" marker-end="none"/>
    <path d="M760 485H540C515 485 500 470 500 445V205"/>
  </g>

  <g font-family="Avenir, 'Avenir Next', Inter, Arial, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="60" y="75" width="260" height="120" rx="22" fill="#f7f9ff" stroke="#a7b4d4" stroke-width="2"/>
      <rect x="390" y="75" width="300" height="120" rx="22" fill="url(#runtime)"/>
      <rect x="760" y="75" width="330" height="120" rx="22" fill="url(#trace)"/>
      <rect x="1190" y="30" width="350" height="120" rx="22" fill="#f7f9ff" stroke="#7f91ca" stroke-width="2"/>
      <rect x="1190" y="220" width="350" height="150" rx="22" fill="#f1fbfa" stroke="#43aaa5" stroke-width="2"/>
      <rect x="760" y="430" width="330" height="110" rx="22" fill="#faf7ff" stroke="#9d79d4" stroke-width="2"/>
    </g>

    <g fill="#17213a">
      <text x="190" y="124" font-size="28" font-weight="600">Model + tools</text>
      <text x="190" y="158" font-size="19" fill="#65708a">pluggable clients • tool APIs</text>

      <text x="1365" y="78" font-size="27" font-weight="600">Replay &amp; evaluation</text>
      <text x="1365" y="112" font-size="19" fill="#65708a">inspection • metrics • dashboard</text>

      <text x="1365" y="278" font-size="27" font-weight="600">Trajectory collection</text>
      <text x="1365" y="313" font-size="19" fill="#507a78">quality filtering</text>
      <text x="1365" y="342" font-size="19" fill="#507a78">state-faithful SFT export</text>

      <text x="925" y="476" font-size="27" font-weight="600">New model</text>
      <text x="925" y="510" font-size="19" fill="#756394">external training</text>
    </g>

    <g fill="#ffffff">
      <text x="540" y="124" font-size="28" font-weight="600">Agent runtime</text>
      <text x="540" y="158" font-size="19" fill="#eef0ff">context • recovery • orchestration</text>

      <text x="925" y="124" font-size="28" font-weight="600">Append-only trace</text>
      <text x="925" y="158" font-size="19" fill="#e8ffff">runtime-visible state</text>
    </g>

    <g font-size="17" font-weight="600" fill="#65708a">
      <text x="1142" y="192">trace events</text>
      <text x="1439" y="192">quality signals</text>
      <text x="620" y="470">feedback</text>
    </g>
  </g>
</svg>
