[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyright]
pythonVersion = "3.12"
include = ["agentic", "recipe", "tests"]
exclude = [".git", ".eggs", ".venv", "build", "dist", "tmp"]

reportGeneralTypeIssues = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportAbstractUsage = false

[tool.mypy]
exclude = [".git", ".eggs", ".venv", "build", "dist", "tmp"]
disable_error_code = ["attr-defined", "has-type", "arg-type"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
indent-width = 4
target-version = "py312"
unsafe-fixes = false
force-exclude = true
exclude = [
    ".git",
    ".eggs",
    ".venv",
    "build",
    "dist",
    "tmp",
]

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 20
max-returns = 15

[tool.ruff.lint.mccabe]
max-complexity = 20 # Maximum cyclomatic complexity.

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",     # missing docstring in public module
    "D101",     # Missing docstring in public class
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "D107",     # Missing docstring in __init__
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed in
    "S301",     # pickle and modules that wrap it can be unsafe when used to deserialize untrusted data, possible security issue
    "RET504",   # Unnecessary assignment to {name} before return statement
    "BLE001",   # Do not catch blind exception: {name}
    "G004",     # Logging statement uses f-string
    "ERA001",   # Found commented-out code
    "D104",     # Missing docstring in public package
    "ISC001",   # Implicitly concatenated string literals on one line
    "COM812",   # Trailing comma missing
    "PIE790",   # Unnecessary pass statement
    "S101",     # Use of assert detected
    "EM101",    # Exception must not use a string literal, assign to variable first
    "SIM108",   # Use ternary operator {contents} instead of if-else-block
    "TRY003",   # Avoid specifying long messages outside the exception class
    "D105",     # Missing docstring in magic method
    "PGH003",   # Use specific rule codes when ignoring type issues
    "SIM103",   # Return the condition {condition} directly
    "EM102",    # Exception must not use an f-string literal, assign to variable first
    "PLR2004",  # Magic value used in comparison, consider replacing {value} with a constant variable
    "PT018",    # Assertion should be broken down into multiple parts
    "PLR1711",  # Useless return statement at end of function
    "RET501",   # Do not explicitly return None in function if it is the only possible return value
    "RUF015",   # Prefer next({iterable}) over single element slice
    "NPY002",   # Replace legacy np.random.{method_name} call with np.random.Generator
    "DTZ007",   # Naive datetime constructed using datetime.datetime.strptime() without %z
    "S311",     # Standard pseudo-random generators are not suitable for cryptographic purposes
    "DTZ001",   # datetime.datetime() called without a tzinfo argument
    "EXE002",   # The file is executable but no shebang is present
    "T201",     # print found
    "TRY300",   # Consider moving this statement to an else block
    "SIM102",   # Use a single if statement instead of nested if statements
    "FBT002",   # boolean-default-value-positional-argument
    "PLC0415",  # import should be at the top-level of a file
    "PERF401",  # Use {message_str} to create a transformed list
    "SLF001",   # Private member accessed: {access}
    "C408",     # Unnecessary {kind}() call (rewrite as a literal)
    "N817",     # CamelCase {name} imported as acronym {asname}
    "PLR1714",  # Consider merging multiple comparisons: {expression}. Use a set if the elements are hashable.
    "C420",     # Unnecessary dict comprehension for iterable; use dict.fromkeys instead
    "S603",     # subprocess call: check for execution of untrusted input
    "N812",     # Lowercase {name} imported as non-lowercase {asname}
    "INP001",   # File {filename} is part of an implicit namespace package. Add an __init__.py.
    "ASYNC240", # Async functions should not use {path_library} methods, use trio.Path or anyio.path
    "N806",     # non-lowercase-variable-in-function
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"recipe/**/*.py" = ["INP001"]
"agentic/model_assets/registry.py" = ["RUF001", "PLW0603"]
"agentic/tools/web_search/search.py" = ["PLR0915"]
"recipe/web_search/agent/context_compression_tool.py" = ["E501"]
"recipe/web_search/agent/prompts.py" = ["E501"]
"recipe/web_search/eval/dsqa_utils.py" = ["E501", "PLR0913", "PLR0915"]
"recipe/web_search/eval/llm_judge.py" = ["E501"]
"recipe/wide_search/agent/prompts.py" = ["E501", "RUF001"]
"recipe/wide_search/eval/evaluation.py" = ["C901", "PLR0912", "PLR0915"]
"recipe/wide_search/eval/prompts.py" = ["E501"]
"tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN202", "D205", "D301", "PT019", "RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "google"
