    endpoint_profiles: [deepseek-v4-pro]
    chat_template_asset: null
    parser_asset: null
    helper_assets: []
    thinking_handling: API reasoning_content when exposed by the provider
    status: endpoint profile supported; no bundled model assets
    match:
      exact: [deepseek-ai/DeepSeek-V4-Pro, DeepSeek-V4-Pro, deepseek-v4-pro]
      regex: ['(?i)deepseek.*v4.*pro']

